# Application Settings
spring.application.name=ProblemHub
server.port=${PORT:8080}

# Tomcat Settings (fix for 400 Bad Request / Request header too large)
server.tomcat.max-http-header-size=65536

# Database Configuration (Direct JDBC with MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/problemhub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:31415}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Thymeleaf Template Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Settings (Max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.problemhub=DEBUG
