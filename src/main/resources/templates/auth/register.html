<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Register - ProblemHub')}"></head>
<body class="bg-light">

    <!-- Main Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container" style="max-width: 680px;">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="navbar-brand-logo justify-content-center mb-2 fs-3">
                    <i class="bi bi-lightbulb-fill text-primary"></i>
                    <span>PROBLEM<span class="accent">HUB</span></span>
                </a>
                <h3 class="fw-bold text-navy">Create Your Account</h3>
                <p class="text-muted-custom small">Join ProblemHub to discover challenges and build impactful projects</p>
            </div>

            <!-- Flash Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Registration Card -->
            <div class="card-custom p-4 p-md-5 mb-4 bg-white shadow-sm">
                <form th:action="@{/process-register}" method="post">
                    <!-- Basic Info -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="fullName" class="form-label fw-semibold small text-navy">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" name="fullName" placeholder="e.g. Rahul Sharma" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold small text-navy">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@college.edu" required>
                        </div>
                    </div>

                    <!-- Passwords -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold small text-navy">Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label fw-semibold small text-navy">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" minlength="6" required>
                        </div>
                    </div>

                    <!-- Role Selection -->
                    <div class="mb-3">
                        <label for="role" class="form-label fw-semibold small text-navy">I am registering as: <span class="text-danger">*</span></label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="STUDENT" selected>Student (Looking for project problem statements)</option>
                            <option value="FACULTY">Faculty / Project Guide (Mentoring student projects)</option>
                            <option value="ORGANIZATION">Organization / Industry / NGO (Posting challenges)</option>
                        </select>
                    </div>

                    <!-- College & Department -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="college" class="form-label fw-semibold small text-navy">College / Organization Name</label>
                            <input type="text" class="form-control" id="college" name="college" placeholder="e.g. DKTE Society's TEI">
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold small text-navy">Department / Branch</label>
                            <input type="text" class="form-control" id="department" name="department" placeholder="e.g. AI & Data Science / CSE">
                        </div>
                    </div>

                    <!-- Year of Study -->
                    <div class="mb-3">
                        <label for="yearOfStudy" class="form-label fw-semibold small text-navy">Academic Year / Position</label>
                        <select class="form-select" id="yearOfStudy" name="yearOfStudy">
                            <option value="1st Year">1st Year Undergraduate</option>
                            <option value="2nd Year">2nd Year Undergraduate</option>
                            <option value="3rd Year" selected>3rd Year (Mini-Project Batch)</option>
                            <option value="4th Year">4th Year (Capstone Major Project)</option>
                            <option value="Postgraduate">Postgraduate / Research Scholar</option>
                            <option value="Industry Representative">Industry / NGO Representative</option>
                        </select>
                    </div>

                    <!-- Skills (For recommendation engine) -->
                    <div class="mb-3">
                        <label for="skills" class="form-label fw-semibold small text-navy">
                            Your Technical Skills <span class="text-muted fw-normal">(Comma separated)</span>
                        </label>
                        <input type="text" class="form-control" id="skills" name="skills" placeholder="e.g. Java, MySQL, Spring Boot, Python, AI/ML, React">
                        <div class="form-text small">Used by ProblemHub's Recommendation Engine to suggest matching problems.</div>
                    </div>

                    <!-- Interests (For recommendation engine) -->
                    <div class="mb-4">
                        <label for="interests" class="form-label fw-semibold small text-navy">
                            Problem Domains of Interest <span class="text-muted fw-normal">(Comma separated)</span>
                        </label>
                        <input type="text" class="form-control" id="interests" name="interests" placeholder="e.g. Healthcare, Environment, Smart City, Education">
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-person-check me-1"></i> Complete Registration
                    </button>

                    <div class="text-center small text-muted-custom">
                        Already have an account? <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
