<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Internal Server Error - ProblemHub')}"></head>
<body class="bg-light">

    <!-- Main Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container text-center py-5" style="max-width: 600px;">
            <div class="card-custom p-5 bg-white shadow-sm border">
                <div class="display-1 fw-bold text-danger mb-3">500</div>
                <h3 class="fw-bold text-navy mb-2">Unexpected Application Error</h3>
                <p class="text-muted-custom mb-4">
                    An error occurred while processing your request. The system administrator has been notified.
                </p>

                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/dashboard}" class="btn btn-primary-custom px-4 py-2">
                        <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-outline-secondary px-4 py-2">
                        <i class="bi bi-house me-1"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
