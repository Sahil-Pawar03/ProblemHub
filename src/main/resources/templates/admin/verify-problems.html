<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Verify Problems - ProblemHub')}"></head>
<body>

    <!-- Main Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
                <div>
                    <h1 class="h2 fw-bold text-navy mb-1">Verify &amp; Moderate Problems</h1>
                    <p class="text-muted-custom mb-0">Audit authentic challenges submitted by organizations, NGOs, and students.</p>
                </div>
                <div class="mt-3 mt-md-0">
                    <a th:href="@{/admin}" class="btn btn-outline-custom btn-sm">
                        &larr; Back to Admin Console
                    </a>
                </div>
            </div>

            <!-- Flash Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card-custom bg-white p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Problem Statement</th>
                                <th>Domain</th>
                                <th>Source Org</th>
                                <th>Difficulty</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${problems}">
                                <td th:text="${p.id}">1</td>
                                <td>
                                    <strong class="text-navy" th:text="${p.title}">Title</strong>
                                    <div class="text-muted small" th:text="${p.suggestedTech}">Tech</div>
                                </td>
                                <td><span class="badge-domain" th:text="${p.domain}">Domain</span></td>
                                <td th:text="${p.organizationName}">Org</td>
                                <td th:text="${p.difficulty}">Intermediate</td>
                                <td>
                                    <span th:class="${p.status == 'APPROVED' ? 'badge bg-success-subtle text-success' : (p.status == 'PENDING' ? 'badge bg-warning-subtle text-dark' : 'badge bg-danger-subtle text-danger')}"
                                          th:text="${p.status}">STATUS</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{'/problems/' + ${p.id}}" class="btn btn-outline-secondary btn-sm" title="View Details">
                                            <i class="bi bi-eye"></i> View
                                        </a>
                                        <form th:if="${p.status != 'APPROVED'}" th:action="@{'/admin/problems/' + ${p.id} + '/approve'}" method="post" class="d-inline">
                                            <input type="hidden" name="redirect" value="/admin/verify-problems">
                                            <button type="submit" class="btn btn-success btn-sm" title="Accept Problem">
                                                <i class="bi bi-check-circle-fill me-1"></i> Accept
                                            </button>
                                        </form>
                                        <form th:if="${p.status != 'REJECTED'}" th:action="@{'/admin/problems/' + ${p.id} + '/reject'}" method="post" class="d-inline">
                                            <input type="hidden" name="redirect" value="/admin/verify-problems">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Reject Problem">
                                                <i class="bi bi-x-circle me-1"></i> Reject
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
